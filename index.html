<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BUG BUSTER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070816;color:#e8e8ff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{border:2px solid #3a3f9a;border-radius:12px;box-shadow:0 0 50px #5b5bff55;max-width:100%;max-height:100%}
</style></head><body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=c.width,H=c.height;
let state='menu',score=0,lives=3,lvl=1,nextAt=350,t=0,combo=0,comboT=0,mult=1,best=+localStorage.getItem('bb2_best')||0;
let muted=false,paused=false,shake=0,flash=0,boss=null,bossBanner=0,lvlBanner=0,slow=0,shield=0,boost=0,bombs=0;
const P={x:W/2,y:H-70,cd:0};
let bullets=[],ebul=[],bugs=[],parts=[],pops=[],pow=[],keys={};
const stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.3});
const WORDS=['NullPointer','404','undefined','SyntaxError','NaN','IndexError','segfault','TypeError','KeyError','infinite loop','memory leak','merge conflict'];
/* ---- audio ---- */
let AC=null;
function beep(f,d,type='square',v=.06,slide=0){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={shot:()=>beep(880,.06,'square',.02,-400),kill:()=>beep(300,.15,'sawtooth',.06,-200),big:()=>beep(160,.3,'sawtooth',.08,-100),hurt:()=>beep(120,.4,'square',.09,-80),pow:()=>{beep(520,.1,'triangle',.07,300);setTimeout(()=>beep(780,.15,'triangle',.07,400),90)},bomb:()=>beep(90,.7,'sawtooth',.12,-50),boss:()=>{beep(70,.8,'sawtooth',.1,20);setTimeout(()=>beep(60,.8,'sawtooth',.1,20),300)},lvl:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.07),i*90))},over:()=>{[400,300,200,100].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sawtooth',.08),i*160))}};
/* ---- helpers ---- */
function reset(){score=0;lives=3;lvl=1;nextAt=350;t=0;combo=0;mult=1;bullets=[];ebul=[];bugs=[];parts=[];pops=[];pow=[];boss=null;slow=shield=boost=0;bombs=1;P.x=W/2;lvlBanner=90}
function boom(px,py,col,n=14,sp=3){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp+1;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col})}}
function pop(px,py,s,col='#fff'){pops.push({x:px,y:py,s,l:1,col})}
function spawn(){
  const r=Math.random(),k=lvl;
  let type='n';if(k>=2&&r<.18)type='z';if(k>=2&&r>.82)type='big';if(k>=4&&r>.7&&r<.8)type='fast';
  const o={x:30+Math.random()*(W-60),y:-30,ph:Math.random()*6,type,w:WORDS[Math.random()*WORDS.length|0]};
  const sp=1+k*.12;
  if(type==='n'){o.r=16;o.hp=1;o.vy=sp*1.1;o.amp=Math.random()*20}
  if(type==='z'){o.r=15;o.hp=1;o.vy=sp*.9;o.amp=70}
  if(type==='big'){o.r=26;o.hp=3+(k>6?1:0);o.vy=sp*.6;o.amp=0}
  if(type==='fast'){o.r=12;o.hp=1;o.vy=sp*2.2;o.amp=0}
  o.fire=type==='big'&&k>=5?120:0;
  bugs.push(o);
}
function spawnBoss(){boss={x:W/2,y:-80,r:55,hp:60+lvl*12,max:60+lvl*12,t:0,dir:1,name:['MEMORY LEAK','RACE CONDITION','STACK OVERFLOW','DEADLOCK'][(lvl/3-1|0)%4]||'MEGA BUG'};bossBanner=150;sfx.boss();bugs=[]}
function hit(){if(shield>0){shield=0;shake=8;boom(P.x,P.y,'#4dd2ff',20);sfx.pow();return}
  lives--;combo=0;mult=1;shake=16;flash=12;boom(P.x,P.y,'#ff5d5d',30);sfx.hurt();
  if(lives<=0){state='over';sfx.over();if(score>best){best=score;localStorage.setItem('bb2_best',best)}}}
function kill(b){const pts=(b.type==='big'?30:b.type==='fast'?20:10)*mult;score+=pts;pop(b.x,b.y,'+'+pts,b.type==='big'?'#ff9ec0':'#bfffd6');
  boom(b.x,b.y,b.type==='big'?'#ff5d8f':'#7dffb0',b.type==='big'?28:14);b.type==='big'?sfx.big():sfx.kill();
  combo++;comboT=150;mult=1+Math.min(4,Math.floor(combo/5));
  if(Math.random()<(b.type==='big'?.5:.07))dropPow(b.x,b.y)}
function dropPow(px,py){const types=['3x','S','B','T','+'];const k=types[Math.random()*types.length|0];pow.push({x:px,y:py,k})}
const PCOL={'3x':'#4dd2ff','S':'#7d8bff','B':'#ff9a3d','T':'#c58bff','+':'#ff5d8f'};
function getPow(p){sfx.pow();boom(p.x,p.y,PCOL[p.k],16);
  if(p.k==='3x'){boost=480;pop(p.x,p.y,'TRIPLE SHOT',PCOL[p.k])}
  if(p.k==='S'){shield=1;pop(p.x,p.y,'SHIELD',PCOL[p.k])}
  if(p.k==='B'){bombs=Math.min(3,bombs+1);pop(p.x,p.y,'+BOMB',PCOL[p.k])}
  if(p.k==='T'){slow=300;pop(p.x,p.y,'SLOW-MO',PCOL[p.k])}
  if(p.k==='+'){lives=Math.min(5,lives+1);pop(p.x,p.y,'+LIFE',PCOL[p.k])}}
function bomb(){if(bombs<=0||state!=='play')return;bombs--;sfx.bomb();flash=14;shake=20;
  bugs.forEach(b=>{boom(b.x,b.y,'#ffb347',16);score+=10;});bugs=[];ebul=[];if(boss){boss.hp-=15}}
function fire(){const d=boost>0?[-12,0,12]:[0];d.forEach(o=>bullets.push({x:P.x+o,y:P.y-18,vx:o*.05}));sfx.shot()}
/* ---- update ---- */
function update(){
  stars.forEach(s=>{s.y+=s.s*(state==='play'?1:.5);if(s.y>H){s.y=0;s.x=Math.random()*W}});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.03});parts=parts.filter(p=>p.l>0);
  pops.forEach(p=>{p.y-=.8;p.l-=.02});pops=pops.filter(p=>p.l>0);
  if(state!=='play'||paused)return;
  t++;
  if(keys.ArrowLeft||keys.a)P.x-=6.5;if(keys.ArrowRight||keys.d)P.x+=6.5;
  P.x=Math.max(20,Math.min(W-20,P.x));
  if(P.cd--<=0){fire();P.cd=boost>0?9:13}
  if(boost>0)boost--;if(slow>0)slow--;if(comboT>0&&--comboT==0){combo=0;mult=1}
  const sf=slow>0?.4:1;
  if(!boss){
    if(t%Math.max(14,58-lvl*4)==0)spawn();
    if(score>=nextAt){if((lvl+1)%3==0){lvl++;spawnBoss()}else{lvl++;nextAt=score+350+lvl*40;lvlBanner=90;sfx.lvl()}}
  }
  if(t%1100==0)dropPow(40+Math.random()*(W-80),-10);
  bullets.forEach(b=>{b.y-=11;b.x+=b.vx});bullets=bullets.filter(b=>b.y>-20&&!b.dead);
  bugs.forEach(b=>{b.y+=b.vy*sf;b.x+=Math.sin((t+b.ph*20)/(b.type==='z'?14:25))*b.amp*.06*sf;b.x=Math.max(15,Math.min(W-15,b.x));
    if(b.fire&&--b.fire<=0){b.fire=140;ebul.push({x:b.x,y:b.y+20,vx:0,vy:3.2})}});
  bullets.forEach(bl=>{bugs.forEach(b=>{if(bl.dead||b.hp<=0)return;if(Math.hypot(bl.x-b.x,bl.y-b.y)<b.r+4){bl.dead=1;b.hp--;boom(bl.x,bl.y,'#ffe14d',3);if(b.hp<=0)kill(b)}});
    if(boss&&!bl.dead&&boss.y>20&&Math.hypot(bl.x-boss.x,bl.y-boss.y)<boss.r){bl.dead=1;boss.hp--;boss.f=3;boom(bl.x,bl.y,'#ffe14d',3);score+=1;}});
  bugs.forEach(b=>{if(b.hp<=0)return;if(b.y>H-20){b.hp=0;hit()}else if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+14){b.hp=0;boom(b.x,b.y,'#ff5d5d',20);hit()}});
  bugs=bugs.filter(b=>b.hp>0);
  if(boss){boss.t++;if(boss.y<110)boss.y+=1.5;else{boss.x+=boss.dir*(1.4+lvl*.08)*sf;if(boss.x>W-70||boss.x<70)boss.dir*=-1;
      if(boss.t%Math.max(40,90-lvl*3)==0){for(let i=-2;i<=2;i++)ebul.push({x:boss.x,y:boss.y+40,vx:i*1.1,vy:3})}
      if(boss.t%200==0){const a=Math.atan2(P.y-boss.y,P.x-boss.x);ebul.push({x:boss.x,y:boss.y+40,vx:Math.cos(a)*4.2,vy:Math.sin(a)*4.2,big:1})}
      if(boss.t%330==0){for(let i=0;i<3;i++)spawn()}}
    if(boss.f>0)boss.f--;
    if(boss.hp<=0){sfx.big();sfx.lvl();for(let i=0;i<6;i++)setTimeout(()=>boom(boss?boss.x:W/2,110,'#ffb347',40,5),0);boom(boss.x,boss.y,'#ff5d8f',80,6);score+=200*mult;pop(boss.x,boss.y,'BOSS DOWN +'+200*mult,'#ffe14d');dropPow(boss.x,boss.y);dropPow(boss.x+30,boss.y);boss=null;nextAt=score+350+lvl*40;lvlBanner=100;ebul=[];shake=24;flash=10}}
  ebul.forEach(b=>{b.x+=b.vx*sf;b.y+=b.vy*sf;if(Math.hypot(b.x-P.x,b.y-P.y)<(b.big?14:10)+12){b.dead=1;hit()}});
  ebul=ebul.filter(b=>!b.dead&&b.y<H+20&&b.x>-20&&b.x<W+20);
  pow.forEach(p=>{p.y+=2;if(Math.hypot(p.x-P.x,p.y-P.y)<26){p.d=1;getPow(p)}});pow=pow.filter(p=>!p.d&&p.y<H+20);
  if(shake>0)shake--;if(flash>0)flash--;if(bossBanner>0)bossBanner--;if(lvlBanner>0)lvlBanner--;
}
/* ---- draw ---- */
function txt(s,px,py,sz,col,al='center'){x.font='bold '+sz+'px "Courier New",monospace';x.textAlign=al;x.fillStyle=col;x.fillText(s,px,py)}
function bg(){const g=x.createLinearGradient(0,0,0,H);const hue=(230+lvl*18)%360;g.addColorStop(0,'hsl('+hue+',55%,14%)');g.addColorStop(1,'#070816');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='hsla('+((hue+60)%360)+',70%,50%,.07)';x.beginPath();x.arc(100+Math.sin(t/300)*30,200,160,0,6.28);x.fill();x.beginPath();x.arc(400,420+Math.cos(t/260)*30,130,0,6.28);x.fill();
  x.strokeStyle='rgba(120,130,255,.06)';x.lineWidth=1;for(let i=0;i<H;i+=40){const y=(i+t*.6)%H;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  stars.forEach(s=>{x.fillStyle='rgba(180,190,255,'+(.3+s.s/3)+')';x.fillRect(s.x,s.y,s.s,s.s)})}
function drawBug(b){x.save();x.translate(b.x,b.y);
  const col=b.type==='big'?'#ff5d8f':b.type==='z'?'#ffd24d':b.type==='fast'?'#ff7a3d':'#7dffb0',fill=b.type==='big'?'#c2185b':b.type==='z'?'#b8860b':b.type==='fast'?'#b23c00':'#1faa59';
  x.strokeStyle=col;x.lineWidth=2;
  for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(-b.r,i*b.r*.5);x.lineTo(-b.r-8,i*b.r*.5+Math.sin(t/4+i)*4);x.moveTo(b.r,i*b.r*.5);x.lineTo(b.r+8,i*b.r*.5+Math.cos(t/4+i)*4);x.stroke()}
  x.fillStyle=fill;x.shadowColor=col;x.shadowBlur=14;x.beginPath();x.ellipse(0,0,b.r,b.r*.85,0,0,6.28);x.fill();x.shadowBlur=0;
  x.fillStyle='#fff';x.beginPath();x.arc(-b.r*.35,-b.r*.2,b.r*.2,0,6.28);x.arc(b.r*.35,-b.r*.2,b.r*.2,0,6.28);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(-b.r*.35,-b.r*.15,b.r*.09,0,6.28);x.arc(b.r*.35,-b.r*.15,b.r*.09,0,6.28);x.fill();x.restore();
  if(b.type!=='fast')txt(b.w,b.x,b.y+b.r+15,11,'#b9bdff')}
function drawBoss(){const b=boss;x.save();x.translate(b.x,b.y);const wob=Math.sin(b.t/10)*3;
  x.shadowColor='#ff3d7f';x.shadowBlur=30;
  for(let i=0;i<4;i++){const s=i<2?-1:1,y=(i%2?1:-1)*28;x.strokeStyle='#ff3d7f';x.lineWidth=5;x.beginPath();x.moveTo(s*40,y);x.lineTo(s*(70+wob),y+(i%2?18:-18));x.lineTo(s*(85+wob),y+(i%2?40:-40));x.stroke()}
  x.fillStyle=b.f>0?'#fff':'#6a0f3a';x.beginPath();x.ellipse(0,0,b.r,b.r*.85,0,0,6.28);x.fill();x.shadowBlur=0;
  x.fillStyle='#ff3d7f';x.beginPath();x.ellipse(0,0,b.r*.7,b.r*.55,0,0,6.28);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(-20,-10,13,0,6.28);x.arc(20,-10,13,0,6.28);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(-20+(P.x-b.x)*.03,-8,6,0,6.28);x.arc(20+(P.x-b.x)*.03,-8,6,0,6.28);x.fill();
  x.fillStyle='#000';x.fillRect(-22,18,44,6);x.restore();
  x.fillStyle='#222';x.fillRect(60,50,W-120,10);x.fillStyle='#ff3d7f';x.fillRect(60,50,(W-120)*Math.max(0,b.hp/b.max),10);x.strokeStyle='#fff';x.strokeRect(60,50,W-120,10);
  txt(b.name,W/2,45,13,'#ffb3cc')}
function draw(){
  x.save();if(shake>0)x.translate((Math.random()-.5)*shake*.6,(Math.random()-.5)*shake*.6);
  bg();
  if(slow>0){x.fillStyle='rgba(160,100,255,.08)';x.fillRect(0,0,W,H)}
  bugs.forEach(drawBug);if(boss)drawBoss();
  bullets.forEach(b=>{x.fillStyle='#ffe14d';x.shadowColor='#ffe14d';x.shadowBlur=10;x.fillRect(b.x-2,b.y-8,4,14);x.shadowBlur=0});
  ebul.forEach(b=>{x.fillStyle='#ff4d6d';x.shadowColor='#ff4d6d';x.shadowBlur=12;x.beginPath();x.arc(b.x,b.y,b.big?9:5,0,6.28);x.fill();x.shadowBlur=0});
  pow.forEach(p=>{const col=PCOL[p.k];x.fillStyle=col;x.shadowColor=col;x.shadowBlur=16;x.beginPath();x.arc(p.x,p.y,13,0,6.28);x.fill();x.shadowBlur=0;txt(p.k,p.x,p.y+5,13,'#06061a')});
  if(state!=='over'){x.save();x.translate(P.x,P.y);
    if(shield>0){x.strokeStyle='rgba(125,139,255,'+(.6+Math.sin(t/5)*.3)+')';x.lineWidth=3;x.beginPath();x.arc(0,0,30,0,6.28);x.stroke()}
    x.shadowColor=boost>0?'#4dd2ff':'#8f8fff';x.shadowBlur=16;x.fillStyle=boost>0?'#4dd2ff':'#8f8fff';
    x.beginPath();x.moveTo(0,-22);x.lineTo(18,16);x.lineTo(0,8);x.lineTo(-18,16);x.closePath();x.fill();x.shadowBlur=0;
    x.fillStyle='#ffb347';x.beginPath();x.moveTo(-5,12);x.lineTo(0,22+Math.random()*10);x.lineTo(5,12);x.fill();x.restore()}
  parts.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;
  pops.forEach(p=>{x.globalAlpha=p.l;txt(p.s,p.x,p.y,14,p.col);x.globalAlpha=1});
  x.restore();
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash/30+')';x.fillRect(0,0,W,H)}
  /* HUD */
  if(state!=='menu'){
    txt('SCORE '+score,16,28,18,'#fff','left');txt('LV '+lvl,W/2,28,18,'#4dd2ff');
    txt('\u2665'.repeat(Math.max(lives,0)),W-16,28,20,'#ff5d8f','right');
    if(mult>1)txt('x'+mult+' COMBO '+combo,16,50,13,'#ffe14d','left');
    txt('BOMBS '+'\u25cf'.repeat(bombs)+'  [B]',W-16,H-14,12,'#ff9a3d','right');
    txt(muted?'MUTED [M]':'SOUND [M]',16,H-14,12,'#8890d8','left');
    if(boost>0){x.fillStyle='#4dd2ff';x.fillRect(16,56,boost/480*90,3)}
    if(slow>0){x.fillStyle='#c58bff';x.fillRect(16,61,slow/300*90,3)}
  }
  if(bossBanner>0){x.globalAlpha=Math.min(1,bossBanner/30);txt('WARNING',W/2,300,44,'#ff3d7f');txt('BOSS INCOMING',W/2,336,20,'#ffb3cc');x.globalAlpha=1}
  else if(lvlBanner>0&&state==='play'){x.globalAlpha=Math.min(1,lvlBanner/30);txt('LEVEL '+lvl,W/2,300,40,'#4dd2ff');x.globalAlpha=1}
  if(paused){x.fillStyle='rgba(8,9,30,.7)';x.fillRect(0,0,W,H);txt('PAUSED',W/2,350,40,'#fff');txt('press P to resume',W/2,385,16,'#b9bdff')}
  if(state==='menu'){x.fillStyle='rgba(8,9,30,.75)';x.fillRect(0,0,W,H);
    txt('BUG BUSTER',W/2,220,54,'#7dffb0');txt('debug the universe',W/2,252,16,'#b9bdff');
    txt('Move: mouse / touch / arrows',W/2,320,15,'#e8e8ff');txt('Auto-fire. B = bomb. P = pause.',W/2,344,15,'#e8e8ff');
    txt('Chain kills for a combo multiplier.',W/2,368,15,'#ffe14d');
    [['3x','triple'],['S','shield'],['B','bomb'],['T','slow-mo'],['+','life']].forEach((a,i)=>{const px=60+i*90;x.fillStyle=PCOL[a[0]];x.beginPath();x.arc(px,425,13,0,6.28);x.fill();txt(a[0],px,430,13,'#06061a');txt(a[1],px,458,11,'#b9bdff')});
    txt('Boss every 3 levels. Good luck.',W/2,500,14,'#ff9ec0');
    if(Math.floor(Date.now()/500)%2)txt('TAP or press SPACE to start',W/2,560,20,'#ffe14d');
    txt('BEST '+best,W/2,605,16,'#ff5d8f')}
  if(state==='over'){x.fillStyle='rgba(8,9,30,.82)';x.fillRect(0,0,W,H);
    txt('SYSTEM CRASH',W/2,270,44,'#ff5d5d');txt('Score '+score,W/2,320,26,'#fff');txt('Level '+lvl+'   Best '+best,W/2,352,18,'#ff5d8f');
    if(score>=best&&score>0)txt('NEW HIGH SCORE!',W/2,385,18,'#ffe14d');
    if(Math.floor(Date.now()/500)%2)txt('TAP or SPACE to retry',W/2,450,20,'#ffe14d')}
}
function start(){if(state!=='play'){reset();state='play';sfx.lvl()}}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();if(state!=='play')start()}
  if(e.key==='b'||e.key==='B')bomb();if(e.key==='p'||e.key==='P')paused=!paused&&state==='play';if(e.key==='m'||e.key==='M')muted=!muted});
addEventListener('keyup',e=>keys[e.key]=0);
function mv(cx){const r=c.getBoundingClientRect();P.x=(cx-r.left)/r.width*W}
c.addEventListener('mousemove',e=>mv(e.clientX));
c.addEventListener('touchmove',e=>{mv(e.touches[0].clientX)},{passive:true});
c.addEventListener('touchstart',e=>{const r=c.getBoundingClientRect(),ty=(e.touches[0].clientY-r.top)/r.height*H;mv(e.touches[0].clientX);if(state!=='play')start();else if(ty>H-50&&e.touches[0].clientX>r.left+r.width*.6)bomb()},{passive:true});
c.addEventListener('mousedown',()=>{if(state!=='play')start()});
